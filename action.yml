name: "agentspec"
description: "Threat model your AI agent config. OWASP Top 10 mapped."
author: "Kaustubh Phatak"

branding:
  icon: "shield"
  color: "red"

inputs:
  config:
    description: "Path to agent config file"
    required: true
  format:
    description: "Config format (auto, agentspec, kiro, claude-code, openai-agents, crewai)"
    default: "auto"
  min-severity:
    description: "Minimum severity to report (CRITICAL, HIGH, MEDIUM, LOW, INFO)"
    default: "LOW"
  fail-on:
    description: "Fail the check if findings at this severity or above exist (CRITICAL, HIGH, MEDIUM, LOW, none)"
    default: "CRITICAL"
  emit-policy:
    description: "Also generate a policy file (mcpfw, rego, cedar, agt, or empty to skip)"
    default: ""

outputs:
  score:
    description: "Overall risk score (0-100)"
  finding-count:
    description: "Number of findings"
  policy-file:
    description: "Path to generated policy file (if emit-policy was set)"

runs:
  using: "composite"
  steps:
    - name: Install agentspec
      shell: bash
      run: pip install git+https://github.com/kphatak001/agentspec.git

    - name: Run scan
      id: scan
      shell: bash
      run: |
        agentspec model "${{ inputs.config }}" \
          --format "${{ inputs.format }}" \
          --min-severity "${{ inputs.min-severity }}" \
          --output-format json -o /tmp/agentspec-report.json

        SCORE=$(python3 -c "import json; print(json.load(open('/tmp/agentspec-report.json'))['overall_score'])")
        COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/agentspec-report.json'))['findings']))")
        echo "score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "finding-count=$COUNT" >> "$GITHUB_OUTPUT"

    - name: Generate policy
      if: inputs.emit-policy != ''
      shell: bash
      run: |
        EXT="${{ inputs.emit-policy }}"
        [ "$EXT" = "rego" ] && SUFFIX=".rego" || SUFFIX=".yaml"
        [ "$EXT" = "cedar" ] && SUFFIX=".cedar"
        OUT="agentspec-policy${SUFFIX}"
        agentspec model "${{ inputs.config }}" \
          --emit-policy --policy-format "${{ inputs.emit-policy }}" -o "$OUT"
        echo "policy-file=$OUT" >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SCORE="${{ steps.scan.outputs.score }}"
        COUNT="${{ steps.scan.outputs.finding-count }}"

        if [ "$COUNT" = "0" ]; then
          BODY="### 🛡️ agentspec — No findings\nRisk score: **${SCORE}/100**"
        else
          REPORT=$(agentspec model "${{ inputs.config }}" \
            --format "${{ inputs.format }}" \
            --min-severity "${{ inputs.min-severity }}" \
            --output-format markdown)
          BODY=$(cat <<'ENDOFCOMMENT'
        ### 🛡️ agentspec — ${COUNT} finding(s)

        Risk score: **${SCORE}/100**

        <details>
        <summary>View findings</summary>

        ${REPORT}

        </details>

        *Generated by [agentspec](https://github.com/kphatak001/agentspec)*
        ENDOFCOMMENT
          )
          BODY=$(echo "$BODY" | sed "s/\${COUNT}/$COUNT/g; s/\${SCORE}/$SCORE/g; s/\${REPORT}/$REPORT/g")
        fi

        gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"

    - name: Fail on severity
      if: inputs.fail-on != 'none'
      shell: bash
      run: |
        python3 -c "
        import json, sys
        report = json.load(open('/tmp/agentspec-report.json'))
        threshold = '${{ inputs.fail-on }}'
        levels = {'CRITICAL': 4, 'HIGH': 3, 'MEDIUM': 2, 'LOW': 1}
        t = levels.get(threshold, 0)
        bad = [f for f in report['findings'] if levels.get(f['severity'], 0) >= t]
        if bad:
            print(f'::error::agentspec: {len(bad)} finding(s) at {threshold} or above')
            sys.exit(1)
        "
