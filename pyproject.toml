[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentspec"
version = "0.1.0"
description = "Threat model generator for agentic AI systems. OWASP Top 10 mapped."
readme = "README.md"
license = {text = "Non-Commercial Source License"}
requires-python = ">=3.10"
authors = [{name = "Kaustubh Phatak"}]
keywords = ["ai-security", "threat-model", "owasp", "agentic-ai", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
pretty = ["rich>=13.0"]

[project.scripts]
agentspec = "agentspec.cli:main"

[project.urls]
Homepage = "https://github.com/kphatak001/agentspec"
Issues = "https://github.com/kphatak001/agentspec/issues"
